<div class="perfil-wrapper">
  <div class="perfil-card">

    <h1>Mi Perfil 🐾</h1>

    <div *ngIf="error" class="mensaje-error">
      <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
    </div>
    <div *ngIf="exito" class="mensaje-exito">
      <i class="fa-solid fa-circle-check"></i> {{ exito }}
    </div>

    <div class="campos-grid">

      <div class="campo campo-full">
        <label>Username</label>
        <input type="text" [(ngModel)]="username" [disabled]="!editando">
      </div>

      <div class="campo campo-full">
        <label>Nombre Completo</label>
        <input type="text" [(ngModel)]="fullName" [disabled]="!editando">
      </div>

      <div class="campo">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" [disabled]="!editando">
      </div>

      <div class="campo">
        <label>Teléfono</label>
        <input type="text" [(ngModel)]="phone" [disabled]="!editando">
      </div>

      <div class="campo">
        <label>Ciudad</label>
        <input type="text" [(ngModel)]="city" [disabled]="!editando">
      </div>

      <div class="campo">
        <label>Dirección</label>
        <input type="text" [(ngModel)]="address" [disabled]="!editando">
      </div>

      <div class="campo">
        <label>Edad</label>
        <input type="number" [(ngModel)]="age" [disabled]="!editando">
      </div>

    </div>

    <div class="botones">
      <button class="btn-editar" *ngIf="!editando" (click)="activarEdicion()">
        <i class="fa-solid fa-pen"></i> Editar Perfil
      </button>

      <button class="btn-guardar" *ngIf="editando" (click)="guardarCambios()">
        <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
      </button>

      <button class="btn-volver" (click)="volver()">
        <i class="fa-solid fa-arrow-left"></i> Volver
      </button>
    </div>

  </div>
</div>
