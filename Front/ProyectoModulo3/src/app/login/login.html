<div class="login-wrapper">

  <div class="login-left">
    <div class="brand">
      <span class="brand-icon">🐾</span>
      <h1 class="brand-title">SIS Pets</h1>
      <p class="brand-sub">Centro de Adopción</p>
    </div>
    <p class="brand-desc">
      Conectamos animales que necesitan un hogar<br>
      con familias llenas de amor.
    </p>
  </div>

  <div class="login-right">
    <div class="login-card">
      <h2 class="login-title">Iniciar Sesión</h2>
      <p class="login-subtitle">Ingresa tus datos para continuar</p>

      <div class="campo" *ngIf="error">
        <div class="mensaje-error">
          <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
        </div>
      </div>

      <div class="campo">
        <label>Usuario</label>
        <input type="text" [(ngModel)]="usuario" placeholder="Ingresa tu usuario" />
      </div>

      <div class="campo">
        <label>Contraseña</label>
        <input type="password" [(ngModel)]="contrasena" placeholder="Ingresa tu contraseña" />
      </div>

      <button class="btn-ingresar" (click)="ingresar()">
        <i class="fa-solid fa-right-to-bracket"></i> Ingresar
      </button>

      <div class="divider">
        <span>¿No tienes cuenta?</span>
      </div>

      <button class="btn-signup" (click)="irSignUp()">
        <i class="fa-solid fa-user-plus"></i> Crear Cuenta
      </button>

      <button class="btn-volver" (click)="volver()">
        <i class="fa-solid fa-arrow-left"></i> Volver al inicio
      </button>
    </div>
  </div>

</div>
